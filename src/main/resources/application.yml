spring:
  application:
    name: galleries

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASS}

server:
  port: 8100

jobrunr:
  database:
    type: sql
    datasource: schedulerDatasource
  background-job-server:
    enabled: true
  dashboard:
    enabled: true
    port: 8101

galleries:
  security:
    remember_me_key: ${GL_REMEMBER_ME_KEY:dev-unsafe-change-me}

  scheduler:
    # noinspection SpringBootApplicationYaml
    datasource:
      jdbc-url: jdbc:sqlite:${GL_SCHEDULER_DB:data.dev/scheduler.db}
      driver-class-name: org.sqlite.JDBC

  scanner:
    amqp:
      exchange_gl: GL_EXCHANGE
      queue_scan_requests: GL_SCAN_REQUESTS
      queue_gen_thumb_requests: GL_GEN_THUMB_REQUESTS
      queue_del_thumb_requests: GL_DEL_THUMB_REQUESTS
    content_dirs:
      root_path: ${GL_CONTENTS_ROOT_PATH:/replace/in/intellij/spring/override}
    image_file_extensions:
      - jpeg
      - jpg
      - png
      - heic
      - webp
    video_file_extensions:
      - mp4
      - mov
      - m4v

neo4j:
  uri: neo4j://${NEO4J_HOST:localhost}:${NEO4J_PORT:7687}
  username: ${NEO4J_USER:neo4j}
  password: ${NEO4J_PASS:neo4j_devpass}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %clr(%-5level) %clr(%-40.40logger{39}){cyan} : %msg%n"
  level:

    # SDN loggers: https://docs.spring.io/spring-data/neo4j/reference/appendix/logging.html
    # Suppresses verbose warnings like:
    #   The property `gpsLatitude` does not exist in database `neo4j`.
    #   Verify that the spelling is correct (01N52).
    org.springframework.data.neo4j.cypher.unrecognized: ERROR

management:
  metrics:

    # Common tags to be added to all metrics.
    tags:
      application: ${spring.application.name}

    distribution:

      # Toggles histogram for specific metrics
      percentiles-histogram:
        gl.scan.request: true
        gl.scan.media.found: true
        gl.scan.media.meta-extraction: true
        gl.scan.media.change-detection: true

  endpoints:
    web:
      exposure:
        include: health, metrics

  otlp:
    metrics:
      export:
        enabled: ${OTEL_ENABLED:false}
        url: ${OTEL_COLLECTOR_HTTP_ENDPOINT:http://localhost:4318}/v1/metrics

        # Use higher value in production
        step: 5s
