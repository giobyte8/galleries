plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.5'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'me.giobyte8.galleries'
version = '2.0.0'

// REPLACED: sourceCompatibility = 'xx'
// BEST PRACTICE: Use Java Toolchain for explicit Java version support.
// This ensures Gradle uses the correct JDK, even if your local JAVA_HOME is different.
java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-amqp'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-neo4j'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-opentelemetry'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'

	// Brings org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
	// onto the classpath, required by JobRunrSqlStorageAutoConfiguration's
	// @AutoConfiguration(after=...) annotation in Spring Boot 4.
	// The scheduler's dedicated SQLiteDataSource bean satisfies
	// @ConditionalOnMissingBean(DataSource.class), preventing Spring Boot
	// from auto-creating a second default datasource.
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'

	implementation 'org.jobrunr:jobrunr-spring-boot-4-starter:8.5.2'
	implementation 'org.xerial:sqlite-jdbc:3.53.0.0'

	implementation 'com.drewnoakes:metadata-extractor:2.19.0'
	implementation 'commons-codec:commons-codec:1.20.0'

	// Protobuf is used for OTLP metrics export, and we need to ensure a
	// compatible version is included.
	implementation 'com.google.protobuf:protobuf-java:4.34.1'

	// TimeShape is used for timezone resolution based on coordinates
	implementation('net.iakovlev:timeshape:2025b.26') {

		// Avoid pulling an older protobuf that breaks OTLP metrics.
		exclude group: 'com.google.protobuf', module: 'protobuf-java'
	}

	annotationProcessor "org.springframework.boot:spring-boot-configuration-processor"
	annotationProcessor 'org.projectlombok:lombok:1.18.42'

	compileOnly 'org.projectlombok:lombok:1.18.42'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
}

// Introducing test suites blog: https://blog.gradle.org/introducing-test-suites
// Reference: https://docs.gradle.org/7.6.1/userguide/jvm_test_suite_plugin.html#sec:jvm_test_suite_usage
testing {
	suites {
		configureEach {
			useJUnitJupiter()
			dependencies {
				implementation 'org.springframework.boot:spring-boot-starter-test'
				implementation 'org.springframework.boot:spring-boot-starter-data-neo4j-test'
				implementation 'org.springframework.security:spring-security-test'
			}
		}

		test(JvmTestSuite)

		integrationTest(JvmTestSuite) {
			dependencies {
				implementation project()

				// Include the main project's runtime classpath so all implementation/runtime deps
				// of the main project are available to the integrationTest suite.
				implementation project.configurations.runtimeClasspath

				// Spring Boot Testcontainers Support
				implementation 'org.springframework.boot:spring-boot-testcontainers'

				// Testcontainers BOM and Modules
				implementation platform('org.testcontainers:testcontainers-bom:2.0.3')
				implementation 'org.testcontainers:testcontainers-junit-jupiter'
				implementation 'org.testcontainers:testcontainers-neo4j'
				implementation 'org.testcontainers:testcontainers-rabbitmq'
			}

			targets {
				all {
					testTask.configure {
						shouldRunAfter(test)
					}
				}
			}
		}
	}
}

